<!DOCTYPE html>
<html>
<head>
    <title>Seller Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 px-4 border-bottom bg-primary">
        <a href="/seller" class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
            <h4 class="fw-bold text-white">NittanyAuction</h4>
        </a>

        <nav class="navbar">
        <form class="form-inline d-flex">
            <input class="form-control mr-sm-2" type="search" placeholder="Type to search..." aria-label="Search">
            <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Search</button>
        </form>
        </nav>

        <div class="col-md-3 text-end">
            <button type="button" class="btn btn-light me-2 text-primary px-4 rounded-3">Sell Item</button>
            {% if seller_type == "student" %}
                <a href="/buyer" type="button" class="btn btn-outline-light me-2 px-4 rounded-3">Browse</a>
            {% endif %}
            <button type="button" class="btn btn-outline-light me-2 px-4 rounded-3">My Account</button>
            <a href="/logout">
                <svg width="32px" height="32px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 16.5V19C15 20.1046 14.1046 21 13 21H6C4.89543 21 4 20.1046 4 19V5C4 3.89543 4.89543 3 6 3H13C14.1046 3 15 3.89543 15 5V8.0625M11 12H21M21 12L18.5 9.5M21 12L18.5 14.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </div>
    </header>

    <div class="d-flex justify-content-center mb-4">
        <div class="col-4" style="width: 50vw;">
            <button onclick="history.back()" class="btn btn-outline-primary px-4">Back</button>
        </div>
    </div>

    
    <div class="mb-5">
        <div class="justify-content-center py-3 col-lg-6 m-auto border rounded-5 bg-white">
            <form method="POST" class="form-signin w-100 m-auto py-3 px-5">
                <h1 class="fw-bold">List New Item</h1>
                <p class="text-secondary fw-light fs-5">Please fill in all of the following details to create a new auction listing.</p>
                <div class="fs-5">
                    <label class="col-form-label fw-semibold">Auction Title</label><br>
                    <input class="form-control fw-light fs-5" type="auction_title" name="auction_title" placeholder="What do you want to name this auction listing?"><br>
                </div>

                <div class="fs-5">
                    <label class="form-label fw-semibold">Product Name</label><br>
                    <input class="form-control fw-light fs-5" type="product_name" name="product_name" placeholder="What product is this?"><br>
                </div>

                <div class="fs-5">
                    <label class="form-label fw-semibold">Product Description</label><br>
                    <textarea class="form-control fw-light fs-5" type="product_description" name="product_description" placeholder="Provide some details about this product..."></textarea>
                    <br>
                </div>

                <div class="d-flex flex-row justify-content-between fs-5">
                    <div class="col-4 pe-1">
                        <label class="form-label fw-semibold">Reserve Price</label><br>
                        <div class="input-group mb-3">
                            <span class="input-group-text fs-5">$</span>
                            <input class="form-control fw-light fs-5" type="number" name="max_bids" placeholder="5" min="1"><br>
                        </div>
                    </div>
                    <div class="col-4 px-1">
                        <label class="form-label fw-semibold">Quantity</label><br>
                        <input class="form-control fw-light fs-5" type="number" name="quantity" placeholder="1" min="1"><br>
                    </div>
                    <div class="col-4 ps-1">
                        <label class="form-label fw-semibold">Max Bids</label><br>
                        <input class="form-control fw-light fs-5" type="number" name="max_bids" placeholder="3" min="1"><br>
                    </div>
                </div>

                <div class="fs-5">
                    <label class="form-label fw-semibold">Category</label><br>
                    <div class="dropdown mb-4">
                        <select class="form-select fs-5">
                            <option selected class="text-secondary">Select a category</option>
                            {% for category in categories %}
                                {% if category != "Root" %}
                                    <option placeholder="Select a category">{{ category }}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 fs-5">Submit</button>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
