<!DOCTYPE html>
<html>
<head>
    <title>Bidder Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary justify-content-center">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 px-4 border-bottom bg-primary">
        <a href="/buyer" class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
            <h4 class="fw-bold text-white">NittanyAuction</h4>
        </a>

        <nav class="navbar">
        <form class="form-inline d-flex">
            <input class="form-control mr-sm-2" type="search" placeholder="Type to search..." aria-label="Search">
            <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Search</button>
        </form>
        </nav>

        <div class="col-md-3 text-end">
            <button type="button" class="btn btn-light me-2 text-primary px-4 rounded-3">Sell Item</button>
            <button type="button" class="btn btn-outline-light me-2 px-4 rounded-3">My Account</button>
            <a href="/logout" type="button" class="btn btn-outline-light px-4 rounded-3">Logout</a>
        </div>
    </header>

    <div class="d-flex flex-row justify-content-center">
        <div class="d-flex mx-5 justify-content-center align-items-start" style="height: 60vh; width: 75vw;">
            <div id="categories" class="card me-4 p-4 rounded-4 w-25 border">
                <h5 class="fw-light">Categories</h5>
            </div>
            <div id="browse-items" class="ms-4 w-75">
                <h1 class="fw-bold fs-1">Welcome, Buyer</h1> <!-- this is placeholder text -->
                <p class="fw-light fs-5">Logged in as: {{ user }}</p> <!-- this can also be placeholder text, will probably move something like this into a pop-up under the "My Account" button -->
                <div class="container px-0">
                    <div class="row row-cols-3 g-4">
                        {% for listing in listings %}
                        <div class="col">
                            <div class="d-flex flex-column justify-content-between h-100 card p-4 rounded-4 border h-10">
                                <div class="mb-4">
                                    <span class="fw-medium fs-5">{{ listing.auction_title }}</span>
                                    <p class="fw-light fs-6 card-text">{{ listing.product_description }}</p>
                                    <hr></hr>
                                    <div id="card-auction-info">
                                    <div class="d-flex flex-row justify-content-between">
                                        <span class="fw-light">Current bid</span>
                                        <span class="fw-bold text-primary">N/A</span> <!-- placeholder for now -->
                                    </div>
                                    <div class="d-flex flex-row justify-content-between">
                                        <span class="fw-light">Bids</span>
                                        <span class="fw-bold text-primary">N/A</span> <!-- another placeholder for now, could alternatively swap with some other info -->
                                    </div>
                                </div>
                                </div>
                                <a class="btn btn-primary fw-medium" href="auction_listing/{{ listing.listing_ID }}">View</a>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
